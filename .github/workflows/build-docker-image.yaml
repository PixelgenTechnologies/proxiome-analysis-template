name: Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: "After building the image, download public PXLs and render the full PAT HTML (smoke test)"
        type: boolean
        default: true

permissions:
  id-token: write
  actions: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push-container:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Smoke test after the image build on releases and manual runs (optional via input).
      # Skipped on ordinary pushes/PRs to avoid multi-GB downloads on every CI run.
      RUN_SMOKE_TEST: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_smoke_test) }}
      PUSH_TO_QUAY: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up build environment
        id: setup_build_env
        uses: ./.github/actions/setup-image-build-env
        with:
          quay-username: ${{ secrets.QUAY_IO_USERNAME }}
          quay-password: ${{ secrets.QUAY_IO_PASSWORD }}
          push: ${{ env.PUSH_TO_QUAY }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            quay.io/pixelgen-technologies/proxiome-analysis-template
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          # load + push cannot both be true; when smoking, load first then push below
          load: ${{ env.RUN_SMOKE_TEST == 'true' }}
          push: ${{ env.PUSH_TO_QUAY == 'true' && env.RUN_SMOKE_TEST != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push image tags to Quay
        if: env.PUSH_TO_QUAY == 'true' && env.RUN_SMOKE_TEST == 'true'
        run: |
          # Image was loaded locally for the smoke test; push the same tags to Quay
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            echo "Pushing ${tag}"
            docker push "${tag}"
          done

      - name: Free disk space for smoke test
        if: env.RUN_SMOKE_TEST == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Resolve smoke-test version
        if: env.RUN_SMOKE_TEST == 'true'
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [[ -z "${VERSION}" ]]; then
              VERSION="dev"
            fi
          fi
          if [[ "${VERSION}" != v* && "${VERSION}" != "dev" ]]; then
            VERSION="v${VERSION}"
          fi
          ASSET="proxiome-analysis-template-example-${VERSION}-html.zip"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "asset=${ASSET}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version=${VERSION}, asset=${ASSET}"

      - name: Download public PXL dataset
        if: env.RUN_SMOKE_TEST == 'true'
        run: |
          chmod +x .github/smoke-test/download_dataset.sh
          .github/smoke-test/download_dataset.sh
          ls -lh data/*.layout.pxl
          df -h

      - name: Render Quarto HTML with image from this build
        if: env.RUN_SMOKE_TEST == 'true'
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Using image from this build: ${IMAGE}"
          docker image inspect "${IMAGE}" >/dev/null
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              quarto render proxiome_analysis_template.qmd
              test -f proxiome_analysis_template.html
            '
          df -h

      - name: Package HTML artifact
        if: env.RUN_SMOKE_TEST == 'true'
        run: |
          ASSET="${{ steps.version.outputs.asset }}"
          rm -f data/*.layout.pxl
          zip -r "${ASSET}" \
            proxiome_analysis_template.html \
            proxiome_analysis_template_files
          ls -lh "${ASSET}"

      - name: Upload HTML smoke-test artifact
        if: env.RUN_SMOKE_TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset }}
          path: ${{ steps.version.outputs.asset }}
          if-no-files-found: error

      - name: Upload HTML zip to GitHub Release
        if: env.RUN_SMOKE_TEST == 'true' && github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          gh release upload "${TAG}" "${ASSET}" --clobber
