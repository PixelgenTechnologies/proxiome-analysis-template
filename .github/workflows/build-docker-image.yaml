name: Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      run_smoke_test:
        description: "After building the image, download public PXLs and render the full PAT HTML (smoke test)"
        type: boolean
        default: true

# Least privilege at the root; jobs elevate only what they need.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Smoke test on every push to main (including PR merges), published releases,
  # and manual runs (optional via input). Skipped on pull requests and version-tag pushes.
  RUN_SMOKE_TEST: ${{ (github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.run_smoke_test) }}
  PUSH_TO_QUAY: ${{ github.event_name != 'pull_request' }}
  IMAGE_NAME: quay.io/pixelgen-technologies/proxiome-analysis-template

jobs:
  meta:
    name: Resolve image tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      staging_image: ${{ steps.staging_ref.outputs.image }}
      publish_tags: ${{ steps.export_tags.outputs.publish_tags }}
      labels: ${{ steps.meta.outputs.labels }}
      run_smoke_test: ${{ env.RUN_SMOKE_TEST }}
      push_to_quay: ${{ env.PUSH_TO_QUAY }}
    steps:
      - name: Docker meta (publish tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Explicit release-tag value: type=semver alone is reliable for tag pushes,
            # but release / workflow_dispatch contexts differ; pin SemVer on published releases.
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-

      - name: Docker meta (smoke staging tag)
        id: staging
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-

      - name: Resolve staging image ref
        id: staging_ref
        run: |
          IMAGE="$(echo '${{ steps.staging.outputs.tags }}' | head -n1)"
          if [[ -z "${IMAGE}" ]]; then
            echo "No staging tag produced by docker/metadata-action" >&2
            exit 1
          fi
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Staging image: ${IMAGE}"

      - name: Export publish tags for downstream jobs
        id: export_tags
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Multiline job outputs require a heredoc delimiter (not a plain key=value).
          {
            echo "publish_tags<<EOF_PUBLISH_TAGS"
            printf '%s\n' "${META_TAGS}"
            echo "EOF_PUBLISH_TAGS"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.platform }})
    needs: meta
    # Native runner per architecture; R package installs are too slow under QEMU.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write # GHA build cache (cache-to: type=gha)
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PUSH: ${{ needs.meta.outputs.push_to_quay == 'true' || needs.meta.outputs.run_smoke_test == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-image-build-env
        with:
          quay-username: ${{ secrets.QUAY_IO_USERNAME }}
          quay-password: ${{ secrets.QUAY_IO_PASSWORD }}
          push: ${{ env.PUSH }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # PRs: build only (no push). Otherwise push untagged by digest;
          # the manifest job tags the multi-arch image.
          outputs: ${{ env.PUSH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || '' }}
          labels: ${{ needs.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Push multi-arch manifest
    needs: [meta, build]
    if: needs.meta.outputs.push_to_quay == 'true' || needs.meta.outputs.run_smoke_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up build environment
        uses: ./.github/actions/setup-image-build-env
        with:
          quay-username: ${{ secrets.QUAY_IO_USERNAME }}
          quay-password: ${{ secrets.QUAY_IO_PASSWORD }}
          push: "true"

      - name: Create and push manifest
        working-directory: /tmp/digests
        env:
          # Smoke path: only the sha staging tag (smoke pulls it; promote after).
          # Non-smoke publish: the full tag set from meta.
          TAGS: ${{ env.RUN_SMOKE_TEST == 'true' && needs.meta.outputs.staging_image || needs.meta.outputs.publish_tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && tag_args+=(--tag "${tag}")
          done <<< "${TAGS}"
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
          docker buildx imagetools inspect "$(head -n1 <<< "${TAGS}")"

  smoke-test:
    name: HTML smoke test
    needs: [meta, manifest]
    if: needs.meta.outputs.run_smoke_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write # gh release upload
      actions: write # upload-artifact
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup-image-build-env
        with:
          quay-username: ${{ secrets.QUAY_IO_USERNAME }}
          quay-password: ${{ secrets.QUAY_IO_PASSWORD }}
          push: "true"

      - name: Pull staging image
        run: |
          IMAGE="${{ needs.meta.outputs.staging_image }}"
          echo "Pulling ${IMAGE}"
          docker pull "${IMAGE}"
          docker image inspect "${IMAGE}" >/dev/null

      - name: Resolve smoke-test version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [[ -z "${VERSION}" ]]; then
              VERSION="dev"
            fi
          fi
          if [[ "${VERSION}" != v* && "${VERSION}" != "dev" ]]; then
            VERSION="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version=${VERSION}"

      - name: Download public PXL dataset
        run: |
          chmod +x .github/smoke-test/download_dataset.sh
          .github/smoke-test/download_dataset.sh
          ls -lh data/*.layout.pxl
          df -h

      - name: Render Quarto HTML with image from this build
        run: |
          IMAGE="${{ needs.meta.outputs.staging_image }}"
          echo "Using image from this build: ${IMAGE}"
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "${IMAGE}" \
            bash -lc '
              set -euo pipefail
              quarto render proxiome_analysis_template.qmd --embed-resources
              test -f proxiome_analysis_template.html
            '
          df -h

      - name: Prepare HTML outputs
        run: |
          rm -f data/*.layout.pxl
          mv proxiome_analysis_template.html proxiome-analysis-template-example.html
          test -f proxiome-analysis-template-example.html

      - name: Upload HTML smoke-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxiome-analysis-template-example
          path: proxiome-analysis-template-example.html
          if-no-files-found: error

      - name: Upload HTML to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.version }}
        run: |
          ls -lh proxiome-analysis-template-example.html
          gh release upload "${TAG}" "proxiome-analysis-template-example.html" --clobber

  push-to-quay:
    name: Push image to Quay
    needs: [meta, manifest, smoke-test]
    # Promote staging → publish tags only after smoke succeeds.
    # Non-smoke publishes happen in the manifest job.
    if: |
      always() &&
      needs.meta.outputs.push_to_quay == 'true' &&
      needs.meta.outputs.run_smoke_test == 'true' &&
      needs.manifest.result == 'success' &&
      needs.smoke-test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-image-build-env
        with:
          quay-username: ${{ secrets.QUAY_IO_USERNAME }}
          quay-password: ${{ secrets.QUAY_IO_PASSWORD }}
          push: "true"

      - name: Promote staging image to publish tags
        env:
          STAGING: ${{ needs.meta.outputs.staging_image }}
          PUBLISH_TAGS: ${{ needs.meta.outputs.publish_tags }}
        run: |
          set -euo pipefail
          if [[ -z "${STAGING}" ]]; then
            echo "Missing staging image ref" >&2
            exit 1
          fi
          if [[ -z "${PUBLISH_TAGS}" ]]; then
            echo "Missing publish tag list from meta job" >&2
            exit 1
          fi
          # Use the tag list computed in meta (same event context). Do not re-run
          # docker/metadata-action here — release vs tag-push SemVer handling can diverge.
          # Registry-side retag (no local image transfer). Works for single- and multi-arch manifests.
          while IFS= read -r tag; do
            [[ -z "${tag}" || "${tag}" == "${STAGING}" ]] && continue
            echo "Promoting ${STAGING} -> ${tag}"
            docker buildx imagetools create --tag "${tag}" "${STAGING}"
          done <<< "${PUBLISH_TAGS}"
