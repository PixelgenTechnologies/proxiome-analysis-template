# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lintr
        run: install.packages("lintr", repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Lint
        run: |
          files <- c(
            "proxiome_analysis_template.qmd",
            list.files("modules", pattern = "\\.qmd$", full.names = TRUE)
          )
          lint_results <- lintr::lint(files)
          print(lint_results)
          if (length(lint_results) > 0) quit(status = 1)
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
